name: CI - PR Checks

on:
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'yarn'

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Run linting
              run: yarn lint

            - name: Build
              run: yarn build

            # Starts the built server without a token; fails if a tool change
            # was not synced into the registry metadata (run `yarn bundle`).
            - name: Check tool lists are in sync
              run: |
                  node scripts/sync-manifest-tools.js
                  git diff --exit-code -- manifest.json server.json
