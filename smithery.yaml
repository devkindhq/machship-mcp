name: machship-mcp
description: Model Context Protocol server for the Machship freight management platform
vendor: Devkind
homepage: https://devkind.com.au
license: ISC
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiToken:
        type: string
        description: Your Machship Bearer token (Settings → API → Generate token)
      apiUrl:
        type: string
        description: Override the Machship API base URL
        default: https://live.machship.com
    required:
      - apiToken
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "machship-mcp"],
      env: {
        MACHSHIP_API_TOKEN: config.apiToken,
        ...(config.apiUrl ? { MACHSHIP_API_URL: config.apiUrl } : {})
      }
    })
